<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Gruppo&family=Noto+Sans+JP:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Zen+Old+Mincho&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js" defer></script>
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-main">
            <a class="logo__image" href="index.html">
                <img class="logo" src="images/logo.png" alt="raisehome" width="254" height="28">
            </a>
            <nav class="header__nav">
                <ul class="header-nav__list">
                <li class="header-nav__item"><a href="company.html">会社概要</a></li>
                <li class="header-nav__item"><a href="access.html">アクセス</a></li>
                <li class="header-nav__item"><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>

            <div class="hamburger">
                <button class="hamburger_button" type="button" aria-label="メニュー">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
                
    </header>
     <main class="subpage">

        <div class="subpage-visual">
            <div class="subpage-img__container">
                <img class="subpage-img" src="images/contact_main.jpg" alt="" width="1440" height="372">
            </div>
            <div class="subpage-title__container">
                <h1 class="subpage-title">お問い合わせ</h1>
            </div>
        </div>

        <div class="contact-form__container">
            <div class="contact-subtitle__container">
                <h2 class="contact-subtitle">お問い合わせ・ご相談は<br>こちらのフォームから</h2>
            </div>
            <form class="contact-form" action="" method="post" onsubmit="return validateForm()">
                <div class="contact-form-list">
                    <div class="contact-form-item">
                        <label class="contact-form-label" for="fullname">お名前<span class="necessary">必須</span></label>
                        <input class="contact-form-input" type="text" id="fullname" name="fullname" placeholder="例）山田 太郎" required>
                    </div>
                    <div class="contact-form-item">
                        <label class="contact-form-label" for="company">企業名</label>
                        <input class="contact-form-input" type="text" id="company" name="company" placeholder="例）株式会社RAISEHOME" required>
                    </div>
                    <div class="contact-form-item">
                        <label class="contact-form-label" for="email">メールアドレス<span class="necessary">必須</span></label>
                        <input class="contact-form-input" type="email" id="email" name="email" placeholder="例）example@mail.com" required>
                    </div>
                        <p class="contact-sub-heading">お問い合わせ種別（選択してください）<span class="necessary">必須</span></p>
                    
                    <div class="contact-list">

                        <label class="contact-list-item"><input type="radio" name="contact">ご質問</label class="contact-form-label">
                        <label class="contact-list-item"><input type="radio" name="contact">ご要望</label class="contact-form-label">
                        <div class="break"></div>
                        <label class="contact-list-item"><input type="radio" name="contact">お見積もり</label class="contact-form-label">
                        <label class="contact-list-item"><input type="radio" name="contact">その他</label class="contact-form-label">

                    </div>
                    <div class="contact-form-item">
                        <label class="contact-form-label" for="inquiry">お問い合わせ内容<span class="necessary">必須</span></label class="contact-form-label">
                        <textarea class="contact-form-input contact-form-textarea" id="inquiry" name="inquiry" placeholder="内容を入力してください。" required></textarea>
                    </div>
                    <div class="agree__container">
                        <label class="agree">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            利用規約、プライバシーポリシーに同意する
                        </label>
                    </div>
                </div>
               
                    <button class="submit-btn btn-black">
                        <span class="btn-text">送信する</span>
                        <span class="arrow btn-black"></span>
                    </button>

            </form>
        </div>

    </main>
    <footer class="footer">
        <div class="footer__container">
        <img class="footer-logo" src="images/logo-white.png" alt="" width="254" height="28">
        <div class="footer-contents-icon">
        <div class="footer-contents">
            <a class="footer-item" href="">会社紹介</a>
            <a class="footer-item" href="">アクセス</a>
            <a class="footer-item" href="">お問い合わせ</a>
        </div>
        <div class="icon__container">
            <img class="icon" src="images/akar-icons_x-fill.png" alt="" width="28" height="28">
            <img class="icon" src="images/streamline_instagram-solid.png" alt="" width="28" height="28">
            <img class="icon" src="images/mdi_youtube.png" alt="" width="28" height="28">
        </div>
        </div>
</div>
        <div class="copyright__container">
            <p class="copyright">©2023RAISE HOME</p>
        </div>
    </footer>
</body>
</html>
